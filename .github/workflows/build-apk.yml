name: Build Debug APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java environment
        shell: bash
        run: |
          set -euo pipefail
          echo "JAVA_HOME=${JAVA_HOME:-<unset>}"
          JAVA_VERSION_OUTPUT="$(java -version 2>&1 || true)"
          echo "$JAVA_VERSION_OUTPUT"
          RAW_VER="$(echo "$JAVA_VERSION_OUTPUT" | awk -F '"' '/version/ {print $2; exit}')"
          if [ -z "$RAW_VER" ]; then
            echo "::error::Failed to detect active Java version."
            exit 1
          fi
          MAJOR_VER="${RAW_VER%%.*}"
          if [ "$MAJOR_VER" = "1" ]; then
            MAJOR_VER="$(echo "$RAW_VER" | cut -d. -f2)"
          fi
          if ! [[ "$MAJOR_VER" =~ ^[0-9]+$ ]]; then
            echo "::error::Unable to parse Java major version from: $RAW_VER"
            exit 1
          fi
          echo "Detected Java major version: $MAJOR_VER"
          if [ "$MAJOR_VER" -lt 17 ]; then
            echo "::error::Java 17 or newer is required, but detected Java $MAJOR_VER."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "./debug.keystore" ]; then
            echo "Existing ./debug.keystore found; skipping generation."
          else
            KEYTOOL_BIN="keytool"
            if [ -n "${JAVA_HOME:-}" ] && [ -x "${JAVA_HOME}/bin/keytool" ]; then
              KEYTOOL_BIN="${JAVA_HOME}/bin/keytool"
            fi
            if ! "$KEYTOOL_BIN" -genkeypair \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000; then
              echo "::error::keytool failed to generate ./debug.keystore."
              exit 1
            fi
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "::error::./debug.keystore was not created."
            exit 1
          fi
          echo "Confirmed ./debug.keystore exists."

      - name: Build debug APK
        id: build_apk
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -e "$APK_PATH" ]; then
            echo "::error::Expected APK not found at $APK_PATH"
            if [ -d "app/build/outputs/apk" ]; then
              echo "Discovered APK files inside app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name '*.apk' || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::$APK_PATH is not a regular file."
            exit 1
          fi
          if [ ! -s "$APK_PATH" ]; then
            echo "::error::$APK_PATH is empty (0 bytes)."
            exit 1
          fi
          if [[ "$APK_PATH" != *.apk ]]; then
            echo "::error::$APK_PATH does not have a .apk extension."
            exit 1
          fi
          APK_SIZE="$(wc -c < "$APK_PATH")"
          echo "Verified debug APK: $APK_PATH (${APK_SIZE} bytes)"

      - name: Upload debug APK artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_release_asset
        shell: bash
        run: |
          set -euo pipefail
          SRC_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$SRC_APK" ] || [ ! -s "$SRC_APK" ]; then
            echo "::error::Source APK missing or empty at $SRC_APK"
            exit 1
          fi
          STAGE_DIR="$(mktemp -d "${RUNNER_TEMP}/apk-release-XXXXXX")"
          DEST_APK="${STAGE_DIR}/app-debug.apk"
          cp "$SRC_APK" "$DEST_APK"
          if [ ! -f "$DEST_APK" ] || [ ! -s "$DEST_APK" ]; then
            echo "::error::Prepared release APK missing or empty at $DEST_APK"
            exit 1
          fi
          echo "asset_path=${DEST_APK}" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: ${DEST_APK}"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_release_asset.outputs.asset_path }}
        run: |
          set -euo pipefail
          if ! gh --version; then
            echo "::error::GitHub CLI (gh) is not available."
            exit 1
          fi
          if [ -z "${ASSET_PATH:-}" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Prepared APK does not exist or is empty."
            exit 1
          fi
          if [[ "$ASSET_PATH" != *.apk ]]; then
            echo "::error::Prepared asset does not end in .apk."
            exit 1
          fi
          ASSET_NAME="$(basename "$ASSET_PATH")"
          if [ "$ASSET_NAME" != "app-debug.apk" ]; then
            echo "::error::Release asset filename must be app-debug.apk, got $ASSET_NAME."
            exit 1
          fi
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "release_title=${RELEASE_TITLE}" >> "$GITHUB_OUTPUT"
          RELEASE_NOTES=$(cat <<EOF
          This is an automatically generated debug APK.

          - Built by: GitHub Actions
          - Run number: ${GITHUB_RUN_NUMBER}
          - Run attempt: ${GITHUB_RUN_ATTEMPT}
          - Source commit SHA: ${GITHUB_SHA}
          - Note: This APK is intended for testing only and is not a Play Store production release.
          - Signing: Signed only with a temporary debug keystore.
          EOF
          )
          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --latest

      - name: Report APK download result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_OUTCOME: ${{ steps.build_apk.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.upload_artifact.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish_release.outcome }}
          RELEASE_TAG: ${{ steps.publish_release.outputs.release_tag }}
          RELEASE_TITLE: ${{ steps.publish_release.outputs.release_title }}
        run: |
          set -euo pipefail
          if [ "$PUBLISH_OUTCOME" = "success" ] && [ -n "${RELEASE_TAG:-}" ]; then
            echo "Confirming GitHub Release ${RELEASE_TAG}..."
            gh release view "$RELEASE_TAG"
            RELEASE_PAGE_URL="$(gh release view "$RELEASE_TAG" --json url --jq .url)"
            DIRECT_APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"
            echo "Release Tag: ${RELEASE_TAG}"
            echo "Release Title: ${RELEASE_TITLE}"
            echo "Release Page URL: ${RELEASE_PAGE_URL}"
            echo "APK Filename: app-debug.apk"
            echo "DIRECT APK DOWNLOAD: ${DIRECT_APK_URL}"
            echo "Backup GitHub Actions artifact app-debug-apk remains available."
            {
              echo "## DIRECT APK DOWNLOAD"
              echo "${DIRECT_APK_URL}"
              echo ""
              echo "- **Release Tag:** ${RELEASE_TAG}"
              echo "- **Release Title:** ${RELEASE_TITLE}"
              echo "- **Release Page:** ${RELEASE_PAGE_URL}"
              echo "- **APK Filename:** app-debug.apk"
              echo "- **Backup Artifact:** Normal Actions artifact \`app-debug-apk\` remains available."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing failed or did not complete."
            if [ "$BUILD_OUTCOME" = "success" ]; then
              echo "The debug APK build succeeded."
            else
              echo "The debug APK build did not succeed (outcome: ${BUILD_OUTCOME})."
            fi
            if [ "$ARTIFACT_OUTCOME" = "success" ]; then
              echo "The normal GitHub Actions artifact 'app-debug-apk' remains available."
            else
              echo "The GitHub Actions artifact 'app-debug-apk' is not available (outcome: ${ARTIFACT_OUTCOME})."
            fi
            {
              echo "## Release Publishing Warning"
              echo "GitHub Release publishing did not succeed, so the new APK is not claimed to be available at the latest-release direct download link."
              if [ "$BUILD_OUTCOME" = "success" ]; then
                echo "- Debug APK build succeeded."
              fi
              if [ "$ARTIFACT_OUTCOME" = "success" ]; then
                echo "- Backup GitHub Actions artifact \`app-debug-apk\` remains available."
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi
